<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCBCU | Route Optimizer — REVAMP PREVIEW (loading…)</title>
<style>
  html,body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F8F9FC;color:#1a1a1a}
  .wrap{max-width:420px;margin:18vh auto;padding:24px;background:#fff;border:1px solid #E2E5EF;border-radius:12px;text-align:center}
  .spin{width:28px;height:28px;border:3px solid #E2E5EF;border-top-color:#E61D2B;border-radius:50%;margin:0 auto 14px;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .err{color:#C41824;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="boot">
  <div class="spin"></div>
  <div style="font-weight:700">Loading REVAMP PREVIEW…</div>
  <div id="status" style="font-size:12px;color:#6B7394;margin-top:8px">Fetching packaged app</div>
  <div class="err" id="err" hidden></div>
</div>
<script>
(async function () {
  var PARTS = 53;
  var status = document.getElementById('status');
  var errEl = document.getElementById('err');
  try {
    var texts = [];
    for (var i = 1; i <= PARTS; i++) {
      status.textContent = 'Fetching part ' + i + ' / ' + PARTS;
      var name = './parts/p' + String(i).padStart(2, '0') + '.part';
      var res = await fetch(name + '?v=20260916e', { cache: 'no-store' });
      if (!res.ok) throw new Error(name + ' HTTP ' + res.status);
      texts.push(await res.text());
    }
    status.textContent = 'Assembling…';
    var html = texts.join('');
    if (html.length < 100000) throw new Error('assembled payload too short: ' + html.length);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    errEl.hidden = false;
    errEl.textContent = String(e && e.message ? e.message : e);
    status.textContent = 'Failed to load preview';
  }
})();
</script>
</body>
</html>
