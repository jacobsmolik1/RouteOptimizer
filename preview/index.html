<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCBCU | Route Optimizer - REVAMP PREVIEW (loading...)</title>
<link rel="stylesheet" href="css/revamp.css">
<style>
  html, body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #F8F9FC; color: #1a1a1a; }
  #boot { max-width: 520px; margin: 12vh auto; padding: 24px; background: #fff; border: 1px solid #E2E5EF; border-radius: 12px; box-shadow: 0 4px 16px rgba(26,32,64,.08); }
  #boot h1 { font-size: 18px; margin: 0 0 8px; }
  #boot p { font-size: 13px; color: #6B7394; line-height: 1.45; margin: 0 0 10px; }
  #boot code { font-size: 12px; background: #EEF0F5; padding: 2px 6px; border-radius: 4px; }
  #boot .err { color: #C41824; font-weight: 600; }
</style>
</head>
<body>
<div id="boot">
  <h1>REVAMP PREVIEW</h1>
  <p>Loading the <strong>real production app</strong> from <code>main/index.html</code>, then applying local revamp packaging chrome...</p>
  <p id="boot-status">Fetching...</p>
</div>
<script>
(async function () {
  var status = document.getElementById('boot-status');
  var SOURCES = [
    'https://cdn.jsdelivr.net/gh/jacobsmolik1/RouteOptimizer@main/index.html',
    'https://raw.githubusercontent.com/jacobsmolik1/RouteOptimizer/main/index.html'
  ];
  var html = null;
  var lastErr = null;
  for (var i = 0; i < SOURCES.length; i++) {
    try {
      status.textContent = 'Fetching production index... (' + (i + 1) + '/' + SOURCES.length + ')';
      var res = await fetch(SOURCES[i] + '?revamp=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      html = await res.text();
      if (!html || html.length < 10000) throw new Error('Unexpected short payload (' + (html && html.length) + ' bytes)');
      break;
    } catch (e) {
      lastErr = e;
      html = null;
    }
  }
  if (!html) {
    status.className = 'err';
    status.innerHTML = 'Could not download production <code>index.html</code>. Network access to GitHub/jsDelivr is required for this preview entry.<br><br>' +
      String(lastErr || 'unknown error');
    return;
  }

  html = html.replace(/<title>[^<]*<\/title>/, '<title>CCBCU | Route Optimizer - REVAMP PREVIEW</title>');

  if (html.indexOf('href="css/revamp.css"') === -1) {
    html = html.replace('</head>', '<link rel="stylesheet" href="css/revamp.css">\n</head>');
  }

  if (html.indexOf('REVAMP_PREVIEW') === -1) {
    var marker = '<' + 'script>';
    var idx = -1;
    var searchFrom = 0;
    while (true) {
      var at = html.indexOf(marker, searchFrom);
      if (at < 0) break;
      var tagEnd = html.indexOf('>', at);
      var openTag = html.substring(at, tagEnd + 1);
      if (openTag.indexOf('src=') === -1) { idx = tagEnd + 1; break; }
      searchFrom = tagEnd + 1;
    }
    if (idx > 0) {
      var inject = '\n/* REVAMP_PREVIEW packaging flag - real production app with revamp chrome */\nconst REVAMP_PREVIEW = true;\nwindow.REVAMP_PREVIEW = true;\n';
      html = html.slice(0, idx) + inject + html.slice(idx);
    }
  }

  if (html.indexOf('src="js/revamp.js"') === -1) {
    html = html.replace('</body>', '<' + 'script src="js/revamp.js"></' + 'script>\n</body>');
  }

  status.textContent = 'Booting production UI...';
  document.open();
  document.write(html);
  document.close();
})().catch(function (e) {
  var status = document.getElementById('boot-status');
  if (status) { status.className = 'err'; status.textContent = String(e); }
});
</script>
</body>
</html>
